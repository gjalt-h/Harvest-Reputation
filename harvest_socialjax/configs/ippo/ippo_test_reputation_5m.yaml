# ENABLE_REPUTATION=true, ippo_test layout, first 5M env steps.
# Training: metrics + checkpoints only (no mid-run GIFs — too costly).
# Post-hoc GIF + episode diag from checkpoints:
#   python harvest_socialjax/scripts/render_ippo_from_checkpoint.py \
#     --run-dir outputs/ippo_test_reputation_5m_<jobid> \
#     --checkpoint checkpoints/ckpt_update_000046.pkl
# Pair with ippo_test_5m baseline W&B curves to pick tragedy/recovery updates
# (e.g. 1.5M→u23, 3M→u46, 5M→u77).
#
# 5_000_000 / (128 x 500) = 78 PPO updates.

"ENV_SCALE": "test"
"ENV_NUM_AGENTS": 5
"ENV_NAME": "harvest_common_open"
"ENV_KWARGS":
  num_inner_steps: 1000
  cnn: true
  jit: true
  shared_rewards: false
  regrowth_scale: 1.0
  apple_density: 1.0
  apple_layout_mode: auto

"SEED": 0
"NUM_SEEDS": 1
"TOTAL_TIMESTEPS": 5_000_000
"ANNEAL_LR_TOTAL_TIMESTEPS": 100_000_000
"NUM_ENVS": 192
"NUM_STEPS": 500
"LR": 5.0e-4
"ANNEAL_LR": true
"UPDATE_EPOCHS": 2
"NUM_MINIBATCHES": 50
"GAMMA": 0.99
"GAE_LAMBDA": 0.95
"CLIP_EPS": 0.2
"ENT_COEF": 0.01
"VF_COEF": 0.5
"MAX_GRAD_NORM": 0.5
"ACTIVATION": "relu"
"LOG_EVERY": 1
"UPDATES_PER_JIT": 5
"DEBUG_PERF": false
"VERBOSE_LOGGING": false
"LOG_PER_AGENT": false
"USE_WANDB": true
"WANDB_MODE": "offline"
"WANDB_MEAN_STD_PLOTS": false
"PROJECT": "harvest_ippo_rep"
"CHECKPOINT_DIR": "checkpoints"
"CHECKPOINT_EVERY": 10
"RENDER_GIF": false
"RENDER_EPISODE_DIAG": false

"ENABLE_REPUTATION": true
"REPUTATION":
  r_star: 0.2
  ema_beta: 0.99
  decay: 0.995
  alpha_h: 0.05
  alpha_z: 0.15

  burst_decay: 0.9
  alpha_burst: 0.0
  embedding_dim: 8
  enable_enforcement: true
  enforcement_strictness: 0.01
